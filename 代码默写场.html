<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>代码默写场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1e1e2e;--bg2:#181825;--bg3:#11111b;
  --fg:#cdd6f4;--dim:#585b70;--cm:#6c7086;
  --blue:#89b4fa;--green:#a6e3a1;--red:#f38ba8;
  --yellow:#f9e2af;--mauve:#cba6f7;--peach:#fab387;
  --line:#313244;
}
html,body{height:100%;overflow:hidden}
body{font-family:"SF Mono",Consolas,"Courier New",monospace;background:var(--bg3);color:var(--fg);font-size:14px}
.app{display:flex;flex-direction:column;height:100vh}

/* topbar */
.topbar{height:40px;background:var(--bg2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.logo{color:var(--mauve);font-weight:700;font-size:13px;margin-right:4px}
.ftabs{display:flex;gap:2px;flex:1;overflow:hidden}
.ftab{padding:4px 12px;font-size:12px;color:var(--dim);background:var(--bg3);
  border-radius:5px 5px 0 0;cursor:pointer;border:1px solid transparent;border-bottom:none;white-space:nowrap}
.ftab.active{color:var(--fg);background:var(--bg);border-color:var(--line)}
.modesw{display:flex;gap:4px}
.modesw button{font-family:inherit;font-size:11px;padding:3px 8px;
  border:1px solid var(--line);background:var(--bg3);color:var(--dim);border-radius:5px;cursor:pointer}
.modesw button.on{background:var(--blue);color:var(--bg3);border-color:var(--blue);font-weight:700}

/* segment progress bar */
.segbar{height:36px;background:var(--bg2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0;overflow-x:auto}
.seg{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;
  font-size:11px;color:var(--dim);border:1px solid var(--line);background:var(--bg3);white-space:nowrap}
.seg.active{color:var(--yellow);border-color:var(--yellow)}
.seg.done{color:var(--green);border-color:var(--green)}
.seg .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.seg-arr{color:var(--dim);font-size:10px}

/* main */
.main{flex:1;display:flex;min-height:0}
.sidebar{width:185px;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0;padding:6px 0}
.sb-hd{font-size:10px;color:var(--dim);text-transform:uppercase;padding:5px 12px;letter-spacing:1px}
.ti{padding:4px 12px;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;color:#bac2de}
.ti:hover{background:var(--bg)}
.ti.folder{color:var(--blue);font-weight:600}
.ti.active{background:#2a2a40;color:#fff}
.ti.ind{padding-left:22px}
.ti.ind2{padding-left:34px}

/* editor */
.edwrap{flex:1;display:flex;flex-direction:column;min-width:0}
.editor{flex:1;overflow-y:auto;background:var(--bg);padding:8px 0 30vh}
.cl{display:flex;align-items:baseline;min-height:22px;line-height:22px;font-size:13.5px}
.cl .ln{width:42px;text-align:right;color:var(--dim);flex-shrink:0;padding-right:14px;font-size:11px;user-select:none}
.cl .ct{flex:1;white-space:pre}
.cl.cur{background:rgba(137,180,250,.07);border-left:2px solid var(--blue)}
.cl.cur .ln{padding-right:12px}
.cl.ghost .ct{color:#25253a}
.seclbl{padding:5px 14px 3px 44px;font-size:11px;color:var(--cm);border-top:1px solid #1e1e2e;display:flex;gap:6px;align-items:center}
.seclbl span{background:var(--bg3);border:1px solid var(--line);padding:1px 7px;border-radius:4px}
.seclbl.done span{color:var(--green);border-color:var(--green)}
.locked-new{animation:flashin .3s ease}
@keyframes flashin{from{background:rgba(166,227,161,.15)}to{background:transparent}}

/* syntax - 收敛到蓝+灰两色，减少视觉干扰 */
.kw{color:#7c85a8}.fn{color:var(--blue)}.st{color:#6a7d6a}.nm{color:var(--fg)}.cm{color:var(--cm);font-style:italic}

/* blanks */
.blk{display:inline-block;background:rgba(249,226,175,.1);border:none;border-bottom:2px solid var(--yellow);
  color:var(--yellow);font-family:inherit;font-size:13.5px;padding:0 3px;outline:none;
  min-width:28px;line-height:20px;border-radius:2px 2px 0 0;text-align:center;vertical-align:baseline}
.blk:focus{background:rgba(137,180,250,.15);border-bottom-color:var(--blue);color:#fff;
  box-shadow:0 0 0 2px rgba(137,180,250,.3)}
.blk.ok{color:var(--green);border-bottom-color:var(--green);background:rgba(166,227,161,.08)}
.blk.err{color:var(--red);border-bottom-color:var(--red);animation:shake .2s}
@keyframes shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}

/* recall inline 补全 */
.rcl{display:inline;outline:none;font-family:inherit;font-size:13.5px;cursor:text;white-space:pre}
.rcl.shakeit{animation:shake .2s}
.rc-typed{color:#fff}
.rc-typed.bad{color:var(--red);text-decoration:underline wavy var(--red)}
.rc-ghost{color:#4a4a63}
.rc-hidden{color:#2c2c40}
.rc-caret{display:inline-block;width:2px;height:15px;background:var(--blue);
  animation:blink 1s step-end infinite;vertical-align:text-bottom;margin:0 1px}
@keyframes blink{50%{opacity:0}}
.lvbadge{font-size:11px;color:var(--peach);background:rgba(250,179,135,.1);
  border:1px solid var(--peach);border-radius:4px;padding:1px 7px;margin-left:4px}

/* HUD */
.hud{height:28vh;background:var(--bg2);border-top:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.hudbar{display:flex;align-items:center;padding:5px 14px;gap:12px;border-bottom:1px solid var(--line);font-size:12px}
.combo{color:var(--peach);font-weight:700;min-width:70px}
.combo.hot{color:var(--red);text-shadow:0 0 8px var(--red)}
.fbar{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.fbar-inner{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0;transition:width .4s}
.pct{color:var(--green);font-weight:700;min-width:40px;text-align:right}
.term{flex:1;overflow-y:auto;padding:8px 14px;font-size:12.5px;line-height:1.65}
.tip{color:var(--yellow)}.tip b{color:#fff}
.why{color:#a9b1d6;margin-top:3px}
.why em{color:var(--yellow);font-style:normal;font-weight:700}
.why b{color:#fff;font-weight:700}
.warn{color:var(--peach);background:rgba(250,179,135,.08);padding:4px 10px;border-radius:4px;border-left:2px solid var(--peach);margin-top:5px}
.warn em{color:var(--red);font-style:normal;font-weight:700}
.sysl{color:var(--green)}
.mhint{color:var(--dim);font-size:11px;border-top:1px solid var(--line);padding:4px 14px;flex-shrink:0}
.kbd{background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:10px;color:var(--fg)}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(17,17,27,.95);display:flex;align-items:center;
  justify-content:center;flex-direction:column;z-index:50;text-align:center;padding:24px}
.ov.hidden{display:none}
.ov h1{font-size:24px;color:var(--mauve);margin-bottom:10px}
.ov p{color:var(--dim);font-size:13px;margin:5px 0;line-height:1.7;max-width:480px}
.ov .big{font-size:50px;margin-bottom:14px}
.ov button{font-family:inherit;margin:5px 4px 0;padding:11px 24px;background:var(--blue);
  color:var(--bg3);border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}
.ov button.ghost{background:var(--bg2);color:var(--fg);border:1px solid var(--line)}
.stats{display:flex;gap:22px;margin:12px 0}
.stats div{text-align:center}
.stats .n{font-size:26px;font-weight:700;color:var(--green)}
.stats .l{font-size:11px;color:var(--dim)}
.secflash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(17,17,27,.9);color:var(--green);font-size:18px;font-weight:700;
  padding:12px 26px;border-radius:10px;border:1px solid var(--green);
  z-index:60;pointer-events:none;opacity:0;transition:opacity .2s}
.secflash.show{opacity:1}
.popup{position:fixed;pointer-events:none;font-size:18px;font-weight:700;color:var(--green);
  z-index:70;animation:floatup .7s ease forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo">⌨</span>
    <div class="ftabs" id="ftabs"></div>
    <div class="modesw" id="modesw">
      <button data-m="follow">跟写</button>
      <button data-m="blank" class="on">挖空</button>
      <button data-m="recall">默写</button>
    </div>
  </div>
  <div class="segbar" id="segbar"></div>
  <div class="main">
    <div class="sidebar">
      <div class="sb-hd">Explorer</div>
      <div id="tree"></div>
    </div>
    <div class="edwrap">
      <div class="editor" id="editor"></div>
      <div class="hud">
        <div class="hudbar">
          <span class="combo" id="combo">🔥 0</span>
          <span id="timer" style="color:var(--blue);min-width:120px;font-size:11px">⏱ 0:00 · 0 行/分</span>
          <div class="fbar"><div class="fbar-inner" id="fpbar"></div></div>
          <span class="pct" id="pct">0%</span>
          <span id="sndbtn" onclick="toggleSound()" style="cursor:pointer;font-size:13px" title="键盘音开关">🔊</span>
        </div>
        <div class="term" id="term"><div class="sysl">▸ 打开文件后自动跳到第一个要填的代码空</div></div>
        <div class="mhint">挖空: 填对自动跳&nbsp;|&nbsp;<span class="kbd">Enter</span> 锁行&nbsp;|&nbsp;<span class="kbd">H</span> 看提示&nbsp;|&nbsp;切"默写"自己敲整行</div>
      </div>
    </div>
  </div>
</div>
<div class="secflash" id="secflash"></div>
<div class="ov" id="startScreen">
  <div class="big">⌨</div>
  <h1>代码默写场</h1>
  <p>自动跳过注释和样板行，光标直接落在第一个<span style="color:var(--yellow)">黄色挖空</span>上。<br>填对一个空自动跳下一个，整行填完 <span class="kbd">Enter</span> 锁行继续。</p>
  <p style="margin-top:6px;color:var(--peach)">挖空 → 默写(Lv0~Lv3逐级减提示)，计时·错题·连击全程记录</p>
  <div id="start-files" style="margin:14px 0;display:flex;flex-direction:column;gap:8px;width:340px"></div>
  <button onclick="closeStart()">▶ 从第一个文件开始</button>
</div>
<div class="ov hidden" id="endScreen"></div>

<script>
const FILES = [
{
  name:"下料机器臂/Main.py",
  desc:"TCP服务端·8081·最先启动",
  sections:[
    { id:"xl_0", name:"连接初始化", lines:[
      {c:"# 导入必要的库"},
      {c:"import os"},
      {c:"import sys"},
      {c:"import socket"},
      {c:"from threading import Thread"},
      {c:"import time"},
      {c:"import DobotDllType as dType"},
      {c:"import re"},
      {c:""},
      {c:"# 加载机械臂动态链接库DobotDll.dll"},
      {c:"api = dType.load()"},
      {c:""},
      {c:"# 连接机械臂"},
      {c:"# ConnectDobot函数返回一个元组，第一个元素是连接状态码"},
      {c:"# 状态码：0-已连接，1-未找到设备，2-端口占用"},
      {c:"# 连接到COM端口，波特率115200"},
      {c:"state = dType.ConnectDobot(api, \"COM6\", 115200)[0]"},
      {c:""},
      {c:"# 打印机械臂连接状态"},
      {c:"# 使用状态码作为索引，从状态描述列表中获取对应文本"},
      {c:"print(\"连接状态:\", [\"已连接\", \"未找到设备\", \"端口占用\"][state])"},
      {c:""},
      {c:"# 设置机械臂PTP运动模式参数(门型运动时抬升高度为100,最大高度为110)"},
      {c:"dType.ClearAllAlarmsState(api)  # 清除所有警报状态"},
      {c:"dType.SetPTPJumpParams(api, 100, 110, isQueued=1)  # 设置跳跃运动参数"},
      {c:"dType.{{SetInfraredSensor}}(api, 1, {{2}}, version=1)  # 设置光电传感器，端口1，版本2",tip:"光电传感器 下料=2 上料=1",why:"第3参是端口号，下料机接2号、上料机接1号，记反了读不到料。"},
      {c:""},
      {c:"# 设置机械臂末端为夹爪"},
      {c:"# 参数：夹爪长度59.7mm，末端类型为夹爪"},
      {c:"dType.SetEndEffectorParams(api, 59.7, 0, 0, 1)"},
      {c:""},
      {c:"# api清空机械臂的指令队列"},
      {c:"dType.SetQueuedCmdClear(api)"},
      {c:""},
      {c:"# 开始执行队列指令"},
      {c:"dType.SetQueuedCmdStartExec(api)"},
      {c:""},
      {c:"# 设置末端夹爪状态"},
      {c:"# 参数：启用夹爪(1)，夹爪打开(0)"},
      {c:"dType.{{SetEndEffectorGripper}}(api, 0, 0, isQueued=1)",tip:"夹爪控制(开/合)",why:"第2参=使能,第3参=开合。现场骨架开头那行常被漏，要补回。"},
      {c:""},
      {c:"# 机械臂回零"},
      {c:"dType.SetHOMECmd(api, 1, isQueued=1)"},
    ]},
    { id:"xl_1", name:"坐标与码垛数据", lines:[
      {c:""},
      {c:"# 定义关键位置坐标"},
      {c:"P1 = [-76.6124,233.7214,108.1663,102.0224]  # 拍照点"},
      {c:""},
      {c:"# P4 = []  # 视觉标定点"},
      {c:""},
      {c:"P5 = [250, 0, 50, 0]  # 零点"},
      {c:"P6 = [-79.4929,278.4865,-3.6015,102.0224]  # 抓取点"},
      {c:""},
      {c:"# 定义4个种类物品的放置位置"},
      {c:"# P3是一个三维列表："},
      {c:"# 第一维：4个不同的物品种类"},
      {c:"# 第二维：每个种类有2个放置点（对应不同的垛）"},
      {c:"# 第三维：每个放置点的坐标[x, y, z, r]"},
      {c:"P3 = ["},
      {c:"    [  # 种类1"},
      {c:"        [193.7174, 196.4782, -63.6996, -11.1977],  # 1垛"},
      {c:"        [214.8398, 137.5126, 0, -25.7088]  # 2垛"},
      {c:"    ],"},
      {c:"    [  # 种类2"},
      {c:"        [275.9170, -0.9370, -64.8519, -56.7977],"},
      {c:"        [233.4059, -52.1135, 0, -69.3046]"},
      {c:"    ],"},
      {c:"    [  # 种类3"},
      {c:"        [200.4951, -189.5624, -66.9641, -99.9976],"},
      {c:"        [216.5076, -192.4751, 0, -114.8311]"},
      {c:"    ],"},
      {c:"    [  # 种类4"},
      {c:"        [8.1148, -275.8029, -66.6523, -144.9178],"},
      {c:"        [18.9142, -292.0411, 0, -161.7859]"},
      {c:"    ],"},
      {c:"]"},
      {c:""},
      {c:"# 记录每个种类物品已放置的数量"},
      {c:"add_up = [0, 0, 0, 0]"},
      {c:""},
      {c:"# 定义4个物品种类的名称"},
      {c:"# 可以根据需要切换不同的命名"},
      {c:"sampleClss=['1.jqr', '2.jxb','3.plc','4.sjxt']"},
    ]},
    { id:"xl_2", name:"线程函数(视觉/分类/上料/语音)", lines:[
      {c:"# sampleClss=['广东省', '浙江省','山东省','四川省']"},
      {c:"#sampleClss = ['1', '2', '3', '4']"},
      {c:""},
      {c:"def vision(socket, name):"},
      {c:"    \"\"\"处理视觉系统的通信线程函数\"\"\""},
      {c:"    while True:"},
      {c:"        # 接收视觉系统发送的数据"},
      {c:"        data = socket.{{recv}}(1024).{{decode}}('utf-8')",tip:"接收数据",why:"recv(1024)收最多1024字节,要.decode转字符串才能比较。"},
      {c:"        print(f\"{name}发送{data}\")"},
      {c:""},
      {c:"        # 如果数据包含\"M\"，是二维码数据，转发给分类系统"},
      {c:"        if \"M\" in data:",tip:"编号标志",why:"视觉识别出二维码后发以M开头的编号,分类端收到才开始识别。"},
      {c:"            M_number=data"},
      {c:"            tcpCliSock3.{{send}}(\"OK\".{{encode}}(\"utf-8\"))",tip:"发送数据",why:"发送的必须是bytes,所以要\"xxx\".encode(\"utf-8\")。漏encode直接报错。"},
      {c:"        elif \"OK\" in data:"},
      {c:"            time.sleep(3)"},
      {c:"            tcpCliSock2.{{send}}(M_number.{{encode}}(\"utf-8\"))",tip:"发送数据",why:"发送的必须是bytes,所以要\"xxx\".encode(\"utf-8\")。漏encode直接报错。"},
      {c:"        # 否则，向视觉系统发送拍照指令"},
      {c:"        elif data ==\"GP2NG\":"},
      {c:"            tcpCliSock1.{{send}}(\"getphoto2\".{{encode}}(\"utf-8\"))",tip:"发送数据",why:"发送的必须是bytes,所以要\"xxx\".encode(\"utf-8\")。漏encode直接报错。"},
      {c:"            time.sleep(1)  #分开发送"},
      {c:"        elif data ==\"GP1NG\":"},
      {c:"            tcpCliSock1.{{send}}(\"getphoto1\".{{encode}}(\"utf-8\"))",tip:"发送数据",why:"发送的必须是bytes,所以要\"xxx\".encode(\"utf-8\")。漏encode直接报错。"},
      {c:"            time.sleep(1)  # 等待1秒，让视觉系统处理"},
      {c:""},
      {c:""},
      {c:"        data = ''  # 清空数据"},
      {c:"        time.sleep(0.5)  # 短暂等待"},
      {c:""},
      {c:"def classification(socket, name):"},
      {c:"    \"\"\"处理分类系统的通信线程函数\"\"\""},
      {c:"    while True:"},
      {c:"        # 接收分类系统发送的数据"},
      {c:"        data = socket.{{recv}}(1024).{{decode}}('utf-8')",tip:"接收数据",why:"recv(1024)收最多1024字节,要.decode转字符串才能比较。"},
      {c:"        print(f\"{name}发送{data}\")"},
      {c:""},
      {c:"        # 获取物品在分类列表中的索引"},
      {c:"        index = sampleClss.index(str(data))"},
      {c:""},
      {c:"        # 移动到抓取点"},
      {c:"        move(P6[0], P6[1], P6[2], P6[3], 0, 1, 1)"},
      {c:""},
      {c:""},
      {c:""},
      {c:"        # 计算放置在哪一垛：0表示第一垛，1表示第二垛"},
      {c:"        # 当已放置数量为0或1时，放在第一垛；当已放置数量为2或3时，放在第二垛"},
      {c:"        k = 0 if add_up[index] < 2 else 1"},
      {c:""},
      {c:""},
      {c:""},
      {c:"        # 计算放置高度偏移：0表示底层，1表示上层"},
      {c:"        # 当已放置数量为偶数时放在底层，奇数时放在上层"},
      {c:"        j = add_up[index] % 2"},
      {c:""},
      {c:"        # 计算最终放置点坐标"},
      {c:"        delta_z = j * 10"},
      {c:"        x = (int)(P3[index][k][0])"},
      {c:"        y = (int)(P3[index][k][1])"},
      {c:"        z = (int)(P3[index][k][2] + delta_z)"},
      {c:"        r = (int)(P3[index][k][3])"},
      {c:""},
      {c:"        print(f\"放置点:{x}, {y}, {z}, {r}\")"},
      {c:""},
      {c:"        # 增加该种类物品计数"},
      {c:"        add_up[index] += 1"},
      {c:""},
      {c:"        # 移动到放置点上方"},
      {c:"        dType.{{SetPTPCmdEx}}(api, 1, x, y, 100, r, isQueued=1)",tip:"PTP点到点运动",why:"第2参=1是运动模式,后面x,y,z,r坐标。带Ex是阻塞版,执行完才返回。"},
      {c:"        # 下降到放置点"},

<script>
/* ===================== 引擎 ===================== */
let mode = 'blank';     // follow | blank | recall
let curFile = 0;
let idx = 0;            // 当前行在 LINES 中的索引
let combo = 0, maxCombo = 0, typed = 0, errs = 0;

/* ── 统一存储（进度/等级/错题/最佳成绩） ── */
const STORE_KEY = 'codedrill_store_v2';
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
  catch { return {}; }
}
function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {} }
function fileStore(fi) {
  const s = loadStore();
  s[fi] = s[fi] || { lv: 0, wrong: {}, bestTime: null, bestAcc: 0, plays: 0 };
  return { all: s, f: s[fi] };
}
// 兼容旧 lv 键
function getLv(fi) { return fileStore(fi).f.lv || 0; }
function bumpLv(fi) {
  const { all, f } = fileStore(fi);
  f.lv = Math.min((f.lv || 0) + 1, 3);
  saveStore(all);
  return f.lv;
}
// 错题：记录某行答案文本被错的次数
function markWrong(fi, key) {
  const { all, f } = fileStore(fi);
  f.wrong[key] = (f.wrong[key] || 0) + 1;
  saveStore(all);
}
function clearWrong(fi, key) {
  const { all, f } = fileStore(fi);
  if (f.wrong[key]) { delete f.wrong[key]; saveStore(all); }
}
// 完成时记录最佳成绩
function recordResult(fi, timeMs, acc) {
  const { all, f } = fileStore(fi);
  f.plays = (f.plays || 0) + 1;
  if (f.bestTime == null || timeMs < f.bestTime) f.bestTime = timeMs;
  if (acc > f.bestAcc) f.bestAcc = acc;
  saveStore(all);
  return f;
}

/* ── 计时 ── */
let startTime = 0, timerHandle = null;
function startTimer() {
  startTime = Date.now();
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(updateTimer, 200);
}
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
function elapsedMs() { return startTime ? Date.now() - startTime : 0; }
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function updateTimer() {
  const el = $('timer');
  if (!el) return;
  const ms = elapsedMs();
  const done = LINES.slice(0, idx).filter(l => !l._secStart && l.c !== '').length;
  const min = ms / 60000;
  const lpm = min > 0.05 ? Math.round(done / min) : 0;
  el.textContent = `⏱ ${fmtTime(ms)} · ${lpm} 行/分`;
}

/* ── 键盘音（WebAudio，无需音频文件） ── */
let audioCtx = null, soundOn = true;
function beep(freq, dur, vol) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.05));
    o.stop(audioCtx.currentTime + (dur || 0.05));
  } catch {}
}
const sndType = () => beep(420 + Math.random() * 60, 0.03, 0.025);  // 敲键
const sndOk   = () => beep(880, 0.08, 0.05);                         // 填对
const sndErr  = () => beep(160, 0.12, 0.06);                         // 错
const sndLock = () => { beep(660, 0.06, 0.05); setTimeout(() => beep(990, 0.08, 0.05), 60); }; // 锁行

// 默写模式难度等级名
let recallLv = 0;
const LV_NAME = ['Lv0 全提示', 'Lv1 首字母', 'Lv2 长度', 'Lv3 纯默写'];

const $ = id => document.getElementById(id);

// 把文件展开成扁平行列表（含 _secStart 标记行）
function buildLines(fi) {
  const rows = [];
  FILES[fi].sections.forEach(sec => {
    rows.push({ _secStart: true, secId: sec.id, secName: sec.name });
    sec.lines.forEach(l => rows.push({ ...l, secId: sec.id }));
  });
  return rows;
}
let LINES = buildLines(0);

/* ── 工具 ── */
function plain(t) { return (t || '').replace(/\{\{(.*?)\}\}/g, '$1'); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 是否需要用户输入：注释/import/空行/段落标记 永不需要
function needsInput(line) {
  if (!line || line._secStart || line.c === '') return false;
  const t = line.c.trim();
  if (t.startsWith('#') || t.startsWith('import ') || t.startsWith('from ') || t.startsWith('"""') || t.startsWith("'''")) return false;
  if (mode === 'recall') return true;     // 默写：真实代码行都要敲
  return /\{\{/.test(line.c);             // 挖空/跟写：有挖空才停
}

// 语法高亮（先保护字符串/注释，避免标签被二次染色）
function hl(s) {
  s = String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let comment = '';
  const h = s.indexOf('#');
  if (h >= 0) { comment = '<span class="cm">' + s.slice(h) + '</span>'; s = s.slice(0, h); }
  const strs = [];
  s = s.replace(/"[^"]*?"|'[^']*?'/g, m => { strs.push(m); return '\u0001S' + String.fromCharCode(65 + strs.length - 1) + '\u0001'; });
  s = s.replace(/\b(def|import|from|if|elif|else|while|for|return|in|not|and|or|None|True|False|as|try|except|break|continue|class|pass)\b/g, '<span class="kw">$1</span>');
  s = s.replace(/\b(dType|socket|Thread|print|input|time|cv2|sum|int|str|float|round)\b/g, '<span class="fn">$1</span>');
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="nm">$1</span>');
  s = s.replace(/\u0001S([A-Z])\u0001/g, (_, ch) => '<span class="st">' + strs[ch.charCodeAt(0) - 65] + '</span>');
  return s + comment;
}

function parseTpl(tpl) {
  const parts = []; let last = 0, m;
  const re = /\{\{(.*?)\}\}/g;
  while ((m = re.exec(tpl))) {
    if (m.index > last) parts.push({ text: tpl.slice(last, m.index) });
    parts.push({ text: m[1], blank: true });
    last = re.lastIndex;
  }
  if (last < tpl.length) parts.push({ text: tpl.slice(last) });
  return parts;
}

/* ── 顶部 ── */
function renderTabs() {
  $('ftabs').innerHTML = FILES.map((f, i) =>
    `<span class="ftab ${i === curFile ? 'active' : ''}" onclick="switchFile(${i})">${f.name.split('/').pop()}</span>`).join('');
}
function renderSeg() {
  const f = FILES[curFile];
  let lineCount = 0;
  $('segbar').innerHTML = f.sections.map((sec, si) => {
    const start = lineCount;
    lineCount += sec.lines.length + 1;
    const done = idx >= lineCount;
    const active = !done && idx >= start;
    const cls = done ? 'done' : active ? 'active' : '';
    return `${si ? '<span class="seg-arr">›</span>' : ''}<div class="seg ${cls}"><div class="dot"></div>${sec.name}</div>`;
  }).join('');
}
function renderTree() {
  $('tree').innerHTML = `<div class="ti folder"><span>📂</span>赛项文件夹</div>` +
    FILES.map((f, i) => {
      const p = f.name.split('/');
      return `<div class="ti folder ind"><span>📁</span>${p[0]}</div>
              <div class="ti ind2 ${i === curFile ? 'active' : ''}" onclick="switchFile(${i})"><span>🐍</span>${p[1]}</div>`;
    }).join('');
}

/* ── 渲染编辑器 ── */
function render() {
  let html = '', ln = 0;
  LINES.forEach((line, i) => {
    if (line._secStart) {
      html += `<div class="seclbl ${i < idx ? 'done' : ''}"><span># ${line.secName}</span></div>`;
      return;
    }
    ln++;
    if (i < idx) {
      const t = plain(line.c);
      html += `<div class="cl"><span class="ln">${ln}</span><span class="ct">${t === '' ? '&nbsp;' : hl(t)}</span></div>`;
    } else if (i === idx) {
      html += `<div class="cl cur"><span class="ln">${ln}</span><span class="ct" id="curct"></span></div>`;
      // ghost 预览
      let g = i + 1, gc = 0, gn = ln;
      while (g < LINES.length && gc < 5) {
        if (!LINES[g]._secStart) { gn++; gc++;
          html += `<div class="cl ghost"><span class="ln">${gn}</span><span class="ct">${hl(plain(LINES[g].c)) || '&nbsp;'}</span></div>`;
        }
        g++;
      }
    }
  });
  $('editor').innerHTML = html;
  renderCurLine();
  updateHUD();
  renderSeg();
  const cur = $('editor').querySelector('.cur');
  if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* ── 快进：跳过所有不需要输入的行 ── */
function fastForward() {
  while (idx < LINES.length && !needsInput(LINES[idx])) idx++;
  if (idx >= LINES.length) { finishFile(); return; }
  render();
}

/* ── 当前行 ── */
function renderCurLine() {
  const line = LINES[idx];
  if (!line) return;
  if (!needsInput(line)) { fastForward(); return; }  // 安全兜底
  const ct = $('curct');
  if (!ct) return;

  if (mode === 'recall') {
    const indent = (line.c.match(/^(\s*)/) || ['', ''])[1];
    const body = plain(line.c).slice(indent.length);
    ct.innerHTML = indent.replace(/ /g, '&nbsp;') +
      `<span class="rcl" id="rcl" data-ans="${esc(body)}" data-lv="${recallLv}" contenteditable="false"></span>` +
      `<span class="rc-caret" id="rc-caret"></span>`;
    bindRecall(body);
    setTerm(line, `默写 <span class="lvbadge">${LV_NAME[recallLv]}</span>&nbsp;逐字敲，Tab 接受补全`);
    return;
  }
  // 挖空 / 跟写
  const parts = parseTpl(line.c);
  let bi = 0, html = '';
  parts.forEach(p => {
    if (p.blank) {
      const ph = mode === 'follow' ? ` placeholder="${esc(p.text)}"` : '';
      html += `<input class="blk" data-bi="${bi}" data-ans="${esc(p.text)}" style="min-width:${Math.max(p.text.length * 9, 30)}px"${ph} autocomplete="off" spellcheck="false">`;
      bi++;
    } else html += `<span>${hl(p.text)}</span>`;
  });
  ct.innerHTML = html;
  bindBlanks();
  setTerm(line, mode === 'follow' ? '跟写：照灰字填' : '挖空：填出关键字');
}

/* ── 绑定输入框 ── */
function bindBlanks() {
  const blanks = [...document.querySelectorAll('#curct .blk')];
  if (!blanks.length) return;
  setTimeout(() => blanks[0].focus(), 20);
  blanks.forEach((b, i) => {
    b.addEventListener('input', () => {
      b.classList.remove('err');
      sndType();
      if (b.value.trim() === b.dataset.ans.trim()) {
        b.classList.add('ok'); b.disabled = true; sndOk();
        const next = blanks.find(x => !x.disabled);
        if (next) next.focus();
        else lockLine(blanks);   // 全部填对，自动锁行
      }
    });
    b.addEventListener('keydown', e => {
      if (e.key === 'Tab') { e.preventDefault(); const n = blanks.find(x => !x.disabled); if (n) n.focus(); }
      if (e.key === 'Enter') { e.preventDefault(); submitLine(blanks); }
      if (e.key === 'h' || e.key === 'H') {
        const l = LINES[idx];
        if (l && (l.tip || l.why)) { showToast('💡 ' + (l.tip || l.why), 2600); }
      }
    });
  });
}

/* ── 默写模式：inline 逐字补全 ── */
function bindRecall(answer) {
  const el = $('rcl');
  const caret = $('rc-caret');
  if (!el) return;
  let pos = 0;          // 已正确输入的字符数
  const lv = recallLv;

  function ghostFor(ch, i) {
    // 根据等级决定剩余部分怎么提示
    if (lv === 0) return ch;                                   // 全字提示
    if (lv === 1) {
      // 只在“单词首字母”给提示，其余用·占位
      const prev = i === 0 ? ' ' : answer[i - 1];
      return /\W/.test(prev) ? ch : (ch === ' ' ? ' ' : '·');
    }
    if (lv === 2) return ch === ' ' ? ' ' : '·';               // 仅长度占位
    return '';                                                  // Lv3 纯默写
  }

  function paint() {
    let html = '';
    for (let i = 0; i < answer.length; i++) {
      const ch = esc(answer[i]);
      if (i < pos) html += `<span class="rc-typed">${ch}</span>`;
      else {
        const g = ghostFor(answer[i], i);
        if (g === '') html += '';
        else html += `<span class="${lv >= 2 ? 'rc-hidden' : 'rc-ghost'}">${esc(g)}</span>`;
      }
    }
    el.innerHTML = html;
    // caret 跟随
  }
  paint();

  function accept(text) {
    // 尝试把 text 逐字匹配到 answer 剩余部分
    for (const c of text) {
      if (answer[pos] === c) { pos++; sndType(); }
      else { wrong(); return; }
    }
    paint();
    if (pos >= answer.length) done();
  }
  function wrong() {
    el.classList.add('shakeit');
    combo = 0; updateHUD(); sndErr();
    markWrong(curFile, answer.trim());   // 记录默写错点
    setTimeout(() => el.classList.remove('shakeit'), 220);
  }
  function done() {
    lockLine();
  }

  // 用一个隐藏的可聚焦区接收键盘
  const handler = e => {
    if (idx >= LINES.length) return;
    if (mode !== 'recall') { document.removeEventListener('keydown', handler); return; }
    if (e.key === 'Enter') { e.preventDefault();
      // Enter = 自动补全整行剩余（视为放弃本行默写，但仍前进）
      if (pos >= answer.length) { done(); }
      else { // 补完剩余并标记
        pos = answer.length; paint(); errs++; combo = 0; updateHUD(); setTimeout(done, 120);
      }
      return;
    }
    if (e.key === 'Tab') { e.preventDefault();
      // Tab = 接受下一个 token（到下一个空格或符号边界）
      let end = pos;
      while (end < answer.length && /\w/.test(answer[end])) end++;
      if (end === pos && end < answer.length) end = pos + 1; // 至少前进一个符号
      pos = end; paint(); if (pos >= answer.length) done();
      return;
    }
    if (e.key === 'Backspace') { e.preventDefault(); if (pos > 0) pos--; paint(); return; }
    if (e.key.length === 1) { e.preventDefault(); accept(e.key); }
  };
  // 卸载上一个监听，挂新的
  if (window._recallHandler) document.removeEventListener('keydown', window._recallHandler);
  window._recallHandler = handler;
  document.addEventListener('keydown', handler);
}

function submitLine(blanks) {
  let ok = true;
  blanks.forEach(b => {
    if (b.value.trim() !== b.dataset.ans.trim()) { b.classList.add('err'); b.classList.remove('ok'); ok = false; }
  });
  if (!ok) {
    typed++; errs++; combo = 0; updateHUD(); sndErr();
    markWrong(curFile, plain(LINES[idx].c).trim());   // 记录错题
    const f = blanks.find(b => b.value.trim() !== b.dataset.ans.trim()); if (f) f.focus();
    return;
  }
  lockLine(blanks);   // 成功计数在 lockLine 内
}

function lockLine() {
  typed++;
  combo++; if (combo > maxCombo) maxCombo = combo;
  sndLock();
  clearWrong(curFile, plain(LINES[idx].c).trim());   // 本行做对，移出错题
  popup('+1' + (combo >= 3 ? ` 🔥${combo}` : ''));
  const prevSec = LINES[idx] && LINES[idx].secId;
  idx++;
  const next = LINES[idx];
  if (prevSec && next && next.secId && next.secId !== prevSec) {
    const sn = FILES[curFile].sections.find(s => s.id === prevSec);
    if (sn) flash('✅ ' + sn.name + ' 完成！');
  }
  if (idx >= LINES.length) { finishFile(); return; }
  fastForward();
}

/* ── HUD ── */
function updateHUD() {
  const total = LINES.filter(l => !l._secStart).length;
  const done = LINES.slice(0, idx).filter(l => !l._secStart).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $('fpbar').style.width = pct + '%';
  $('pct').textContent = pct + '%';
  const c = $('combo');
  c.textContent = '🔥 ' + combo;
  c.className = 'combo' + (combo >= 3 ? ' hot' : '');
}
function setTerm(line, note) {
  let h = '';
  if (line && line.tip) h += `<div class="tip"><b>▸</b> ${line.tip}</div>`;
  if (line && line.why) h += `<div class="why">💡 ${line.why}</div>`;
  if (line && line.warn) h += `<div class="warn">⚙️ 必改：${line.warn}</div>`;
  if (note) h += `<div class="why" style="margin-top:5px">${note}</div>`;
  if (h) $('term').innerHTML = h;
}
function showToast(msg, dur) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:12%;left:50%;transform:translateX(-50%);background:rgba(17,17,27,.95);color:#f9e2af;padding:9px 18px;border-radius:8px;font-size:13px;z-index:80;border:1px solid #f9e2af;max-width:80%';
  t.innerHTML = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), dur || 1800);
}
function popup(txt) {
  const cur = $('editor').querySelector('.cur');
  const p = document.createElement('div');
  p.className = 'popup'; p.textContent = txt;
  const r = cur ? cur.getBoundingClientRect() : { left: 400, top: 300, width: 200 };
  p.style.left = (r.left + r.width * 0.4) + 'px'; p.style.top = (r.top - 8) + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 700);
}
function flash(msg) {
  const f = $('secflash'); f.textContent = msg; f.classList.add('show');
  setTimeout(() => f.classList.remove('show'), 1600);
}

/* ── 文件完成 ── */
function finishFile() {
  if (window._recallHandler) { document.removeEventListener('keydown', window._recallHandler); window._recallHandler = null; }
  stopTimer();
  const ms = elapsedMs();
  render();
  const f = FILES[curFile];
  $('term').innerHTML = `<div class="sysl">$ python ${f.name.split('/').pop()}</div>` +
    (f.run || '完成').split('\n').map(l => `<div class="sysl">${esc(l)}</div>`).join('');
  const acc = typed ? Math.round((typed - errs) / typed * 100) : 100;
  const rec = recordResult(curFile, ms, acc);
  let leveledTo = null;
  if (mode === 'recall') { leveledTo = bumpLv(curFile); }
  setTimeout(() => showEnd(leveledTo, ms, acc, rec), 700);
}
function showEnd(leveledTo, ms, acc, rec) {
  const last = curFile >= FILES.length - 1;
  const totalLines = LINES.filter(l => !l._secStart && l.c !== '').length;
  const lpm = ms > 2000 ? Math.round(totalLines / (ms / 60000)) : 0;

  // 最佳记录提示
  const isNewBest = rec && rec.bestTime === ms && rec.plays > 1;
  const bestLine = rec && rec.bestTime ? `最佳 ${fmtTime(rec.bestTime)} · ${Math.max(rec.bestAcc, acc)}% 准确率` : '';

  // 错题清单
  const { f: fStore } = fileStore(curFile);
  const wrongKeys = Object.entries(fStore.wrong || {})
    .sort((a, b) => b[1] - a[1]).slice(0, 5);
  const wrongHtml = wrongKeys.length
    ? `<div style="margin:10px 0 4px;font-size:12px;color:var(--peach);text-align:left;max-width:500px">
        ⚠️ 高频错点（建议重点记忆）：
        ${wrongKeys.map(([k, n]) => `<div style="font-family:monospace;font-size:11px;color:var(--fg);padding:2px 8px;background:var(--bg3);border-radius:4px;margin-top:4px">
          ×${n} ${k.length > 55 ? k.slice(0, 55) + '…' : k}</div>`).join('')}
      </div>` : '';

  let lvMsg = '';
  if (leveledTo != null) {
    lvMsg = leveledTo >= 3
      ? `<p style="color:var(--green)">默写 ${LV_NAME[3]}！可以脱稿写完整份代码了。</p>`
      : `<p style="color:var(--peach)">难度提升 → 下次为 <b>${LV_NAME[leveledTo]}</b></p>`;
  }

  $('endScreen').innerHTML = `
    <div class="big">${last ? '🏆' : (isNewBest ? '🥇' : '✅')}</div>
    <h1>${FILES[curFile].name.split('/').pop()} 完成！${isNewBest ? ' 新纪录！' : ''}</h1>
    <div class="stats">
      <div><div class="n">${fmtTime(ms)}</div><div class="l">用时</div></div>
      <div><div class="n">${lpm}</div><div class="l">行/分</div></div>
      <div><div class="n">${maxCombo}</div><div class="l">最高连击</div></div>
      <div><div class="n">${acc}%</div><div class="l">准确率</div></div>
    </div>
    ${bestLine ? `<p style="color:var(--dim);font-size:12px">${bestLine}</p>` : ''}
    ${wrongHtml}
    ${lvMsg}
    <p>${last ? '三个文件全部完成！切「默写」逐级提高难度。' : '继续下一个文件。'}</p>
    <div>
      <button onclick="recallAgain()">🔁 默写再练一遍</button>
      ${last ? '' : `<button class="ghost" onclick="nextFile()">下一文件 ▶</button>`}
      <button class="ghost" onclick="retryFile()">重写本文件</button>
    </div>`;
  $('endScreen').classList.remove('hidden');
}
function recallAgain() {
  mode = 'recall';
  [...$('modesw').children].forEach(b => b.classList.toggle('on', b.dataset.m === 'recall'));
  resetFile();
}

/* ── 控制 ── */
function resetFile() {
  if (window._recallHandler) { document.removeEventListener('keydown', window._recallHandler); window._recallHandler = null; }
  LINES = buildLines(curFile);
  idx = 0; combo = 0; maxCombo = 0; typed = 0; errs = 0;
  recallLv = getLv(curFile);     // 载入该文件已达到的默写等级
  $('endScreen').classList.add('hidden');
  renderTabs(); renderTree();
  startTimer();                  // 开始计时
  fastForward();   // 直接跳到第一个要输入的行
}
function nextFile() { curFile = Math.min(curFile + 1, FILES.length - 1); resetFile(); }
function retryFile() { resetFile(); }
function switchFile(i) { curFile = i; resetFile(); }

/* ── 模式切换 ── */
$('modesw').addEventListener('click', e => {
  if (!e.target.dataset.m) return;
  mode = e.target.dataset.m;
  [...$('modesw').children].forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  // 重新从当前段开头附近定位（简单起见：重置到当前文件，保留进度不易，直接重置本文件）
  resetFile();
});

/* ── 启动 ── */
function toggleSound() {
  soundOn = !soundOn;
  $('sndbtn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) sndOk();
}
function renderStartFiles() {
  const el = $('start-files');
  if (!el) return;
  el.innerHTML = FILES.map((f, i) => {
    const { f: fs } = fileStore(i);
    const lv = fs.lv || 0;
    const plays = fs.plays || 0;
    const best = fs.bestTime ? `最佳 ${fmtTime(fs.bestTime)} · ${fs.bestAcc}%` : '未练过';
    const lvColor = ['var(--dim)','var(--yellow)','var(--peach)','var(--green)'][lv];
    return `<div onclick="startFile(${i})" style="background:var(--bg2);border:1px solid var(--line);border-radius:8px;
      padding:10px 14px;cursor:pointer;text-align:left;transition:border-color .2s"
      onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--line)'">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:13px">🐍 ${f.name}</span>
        <span style="font-size:11px;color:${lvColor}">默写 ${LV_NAME[lv]}</span>
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:4px">${f.desc} &nbsp;|&nbsp; 练过${plays}次 &nbsp;|&nbsp; ${best}</div>
    </div>`;
  }).join('');
}
function startFile(fi) {
  curFile = fi;
  $('startScreen').classList.add('hidden');
  resetFile();
}
function closeStart() {
  curFile = 0;
  $('startScreen').classList.add('hidden');
  resetFile();
}
renderTabs(); renderTree(); renderStartFiles();
</script>
</body>
</html>
